name: Build and Test

on:
  pull_request:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    name: Build and Test
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.x'
      
      - name: Build
        run: dotnet build
      
      - name: Test
        run: dotnet test ./Tests/Tests.csproj --settings ./Tests/coverlet.runsettings --results-directory ./Tests/TestResults

      - name: Install dotnet coverage tool
        run: dotnet tool install --global dotnet-coverage

      - name: Merge coverage reports
        run: dotnet coverage merge ./Tests/TestResults/**/coverage.cobertura.xml --recursive --output ./Tests/unified.cobertura.xml --output-format cobertura

      - name: Generate coverage report
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: ./Tests/unified.cobertura.xml
          badge: true
          fail_below_min: false
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: false
          output: both
          thresholds: '60 80'

      - name: Report coverage to PR
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          recreate: true
          path: code-coverage-results.md