services:
  groovo:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Production}
      - JwtSettings__Secret=${JWT_SECRET}
      - CorsSettings__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN:-http://localhost:3000}
      - ConnectionStrings__DefaultConnection=Data Source=/App/uploads/database/${ASPNETCORE_ENVIRONMENT:-Production}.sqlite
    volumes:
      - ${SQLITE_PATH:-./uploads/database}:/App/uploads/database
      - ${UPLOADS_PATH:-./uploads}:/App/uploads
      - ${LOGS_PATH:-./logs}:/App/logs
    restart: unless-stopped
